# The field -> role taxonomy behind the Tracks picker (spec 2026-09-14-portal-design.md, §5).
# Picking a role creates a track named after it, with these keywords and min_fit 60.
# `themuse_category` and `adzuna_category` are the category names those two APIs use for the
# field; keyword-only sources get the track's keywords instead.
# `titles` are job-title phrases that mean the role (whole-word, case-insensitive; a space also
# matches a hyphen). `exclude_titles` are words that veto a match: a title that contains a
# `titles` phrase AND an `exclude_titles` word is NOT this role ("Flight Test Engineer" is not QA).
# Both feed role-first ranking (spec 2026-10-07-search-quality-design.md, B1). A change here takes
# effect after an image rebuild and a rescore.
