[project]
name = "rhapto"
version = "0.1.0"
description = "Human-in-the-loop AI job application copilot"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=0.50",
    "fastembed>=0.4",
    "numpy>=1.26",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rapidfuzz>=3.9",
]

[project.scripts]
rhapto = "rhapto.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "datamodel-code-generator>=0.26",
    "import-linter>=2.0",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhapto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/rhapto/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format; long string literals are allowed

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["rhapto"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "docx.*", "rapidfuzz.*"]
ignore_missing_imports = true
