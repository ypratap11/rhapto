services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rhapto
      POSTGRES_PASSWORD: rhapto
      POSTGRES_DB: rhapto
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhapto -d rhapto"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rhapto:rhapto@db:5432/rhapto
      REDIS_URL: redis://redis:6379/0
      RHAPTO_PACKAGES_DIR: /data/packages
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - packages:/data/packages
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    restart: unless-stopped
    # The worker embeds documents (FastEmbed) and holds a poll's identity map in memory; without a
    # cap a runaway batch can take down the host instead of just the container. arq itself restarts
    # a killed worker process, so an OOM here is a contained, visible failure, not silent data loss.
    mem_limit: 2g
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rhapto:rhapto@db:5432/rhapto
      REDIS_URL: redis://redis:6379/0
      RHAPTO_PACKAGES_DIR: /data/packages
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - packages:/data/packages
      - models:/models
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Single-dash `-`, not `:-`: Compose's `:-` substitutes the default for an unset *or*
        # empty value, which is the exact "empty means unset" bug this task fixed one layer up in
        # apps/web/src/lib/api/client.ts. An access-mode deploy sets RHAPTO_PUBLIC_API_URL= (empty,
        # in .env) precisely so this build arg comes through empty and SAME_ORIGIN_DEPLOYMENT can
        # become true; `:-` would silently override that back to the localhost default and the
        # same-origin proxy would never be used (fix-round finding I3).
        NEXT_PUBLIC_API_URL: ${RHAPTO_PUBLIC_API_URL-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  packages:
  models:
