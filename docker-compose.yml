services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rhapto
      POSTGRES_PASSWORD: rhapto
      POSTGRES_DB: rhapto
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhapto -d rhapto"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rhapto:rhapto@db:5432/rhapto
      REDIS_URL: redis://redis:6379/0
      RHAPTO_PACKAGES_DIR: /data/packages
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - packages:/data/packages
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rhapto:rhapto@db:5432/rhapto
      REDIS_URL: redis://redis:6379/0
      RHAPTO_PACKAGES_DIR: /data/packages
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - packages:/data/packages
      - models:/models
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${RHAPTO_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  packages:
  models:
